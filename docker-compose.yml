services:
  ddos-shield-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ddos-shield-ai-v2
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DEFENSE_MODE=DRY_RUN
      - DEFAULT_RPS_THRESHOLD=80
      - DEFAULT_BURST_CAPACITY=120
      - CIRCUIT_BREAKER_CPU_THRESHOLD=85
      - CIRCUIT_BREAKER_RAM_THRESHOLD=90
      - ADMIN_SAFE_IPS=127.0.0.1,::1,192.168.1.0/24
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
